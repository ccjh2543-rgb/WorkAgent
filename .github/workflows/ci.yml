# 持续集成：格式、构建、静态检查、单测
#
# 只在 windows 上跑：本项目的交付与运行环境都是 Windows，
# 且 domain/artifact 的路径安全用例依赖 Windows 路径语义，
# 在 Linux 上断言会失真。跨平台支持后再补 ubuntu 任务。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 依赖清单与代码一致（go.mod / go.sum 无漂移）
        shell: bash
        run: go mod tidy -diff

      - name: 格式检查（gofmt）
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 构建
        shell: bash
        run: go build ./...

      - name: 静态检查（go vet）
        shell: bash
        run: go vet ./...

      - name: 单元测试
        shell: bash
        run: go test ./...
